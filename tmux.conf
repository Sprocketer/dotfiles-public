# General settings
HOME=/home/$USER
set -g base-index 1
setw -g pane-base-index 1
set -g status-bg "#dd9327"
set -g default-terminal "screen-256color"
set -s escape-time 0 # Prevent Neovim mode switching delay
set -g history-limit 50000 # Increase scrollback buffer size from 2000 to 50000 lines
# set -g display-time 4000 # Increase tmux messages display duration from 750ms to 4s
set -g focus-events on
setw -g aggressive-resize on
set -g mouse on # Can use mouse to focus panes, switch windows & scroll through buffer
bind R source-file $HOME/.tmux.conf

# TMUX Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Smart pane switching
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"~nvim"'
resurrect_dir=$HOME/.tmux/resurrect/
set -g @resurrect-dir $resurrect_dir
set -g @resurrect-hook-post-save-all "sed -i 's/--cmd lua.*--cmd set packpath/--cmd \"lua/g; s/--cmd set rtp.*\$/\"/' $resurrect_dir/last"
# Note: Use <prefix>-C-s to save a session, and <prefix>-C-r to restore a session

# Run TPM (must be at end)
run '~/.tmux/plugins/tpm/tpm'
# Note: Use <prefix>-S-u to update plugins
# Note: Use <prefix>-A-u to uninstall plugins not in config
# Everything with rebinds must be after TPM

# Clear screen rebinding (disabled moving right with vim-tmux-navigator from a terminal buffer
bind-key -T root C-l \
  if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" \
    "send-keys 'C-l'" \
    "send-keys 'C-l' ; clear-history"

# TMUX Sessionizer
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r k run-shell "~/.local/scripts/tmux-sessionizer ~/code/work/tmux-theme"
bind-key -n C-f display-popup -E -w 40% -h 40% "tmux-sessionizer" # C-f fix for within sessions, opens popup

# Pop-up terminal bind
bind-key -n C-k display-popup -E -w 50% -h 50% "tmux"
# Note: can use tmuxifier for this

# Window splitting
bind-key -r % split-window -c "#{pane_current_path}" -h
bind-key -r \" split-window -c "#{pane_current_path}" -v

# Vim bindings for scrollback
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
set -s copy-command 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

